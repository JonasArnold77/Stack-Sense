# EB-Default (60s) reicht nicht für /api/v1/recommendations — die Pipeline
# macht mehrere sequentielle Claude-Aufrufe + PubMed-Lookup und kann bei
# kaltem Cache deutlich länger brauchen. Ohne diese Datei bricht nginx die
# Verbindung zum Backend vorzeitig ab (siehe /var/log/nginx/error.log:
# "upstream timed out ... reading response header ... POST /api/v1/recommendations"),
# der Client bekommt dann einen Verbindungsfehler statt einer (langsamen,
# aber gültigen) Antwort.
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
