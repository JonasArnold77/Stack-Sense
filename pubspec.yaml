name: stacksense
description: Personalisierte, evidenzbasierte Supplement-Beratung.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.2

  # Local Storage
  shared_preferences: ^2.3.1

  # Umgebungsvariablen (.env)
  flutter_dotenv: ^5.2.1

  cupertino_icons: ^1.0.6

  # HTTP
  http: ^1.2.2

  # UI Extras
  gap: ^3.0.1

  # URLs im Browser öffnen (Produktlinks)
  url_launcher: ^6.3.0

  # Audio für XP-Belohnungsgeräusch
  audioplayers: ^6.0.0

  # AWS Cognito Auth
  amplify_flutter: ^2.4.1
  amplify_auth_cognito: ^2.4.1

  # Google Sign-In (für Cognito Social Provider)
  google_sign_in: ^6.2.1
  health: ^13.3.2
  intl: ^0.20.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - .env

# App-Icon (Android-Launcher) — Quelle: assets/icons/app_icon.png (voller
# Hexagon-Mark). Adaptive Icon (Android 8+) trennt Hintergrund (Marineblau-
# Fläche) und Vordergrund (nur die Pflanze, transparent freigestellt) damit
# Launcher-Masken (Kreis/Squircle/Rund) die Pflanze nicht anschneiden.
# Neu generieren nach jeder Änderung: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#162E52"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 26

# Splash-Screen (Startbildschirm) — Hexagon-Logo + "Life Lab"-Schriftzug als
# ein zusammengesetztes Bild (assets/images/splash_logo.png, aus dem
# Hexagon-Logo + dem weißen Wortmarken-Bild gebaut), zentriert auf
# Marineblau-Hintergrund. Neu generieren nach jeder Änderung:
# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#162E52"
  image: assets/images/splash_logo.png
  android_12:
    color: "#162E52"
    image: assets/images/splash_logo.png
